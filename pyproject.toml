[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mango-disease-ai"
version = "0.2.0"
description = "AI-powered Amrapali mango disease detection: reject non-mango photos, classify 7 diseases, mark the affected area with Grad-CAM and produce PDF reports in English or Bangla."
readme = "README_PACKAGE.md"
license = "MIT"
requires-python = ">=3.10"

authors = [
    { name = "AIUB Student Group (Arpon, Oni, Md. Ibtihazzaman)", email = "arponamit.55@gmail.com" }
]

keywords = [
    "mango",
    "disease",
    "detection",
    "deep-learning",
    "plant-disease",
    "grad-cam",
    "mobilenetv2",
    "maf-net",
    "agriculture",
    "amropali",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core runtime dependencies
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "scipy>=1.11.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "fpdf2>=2.7.0",
    "uharfbuzz>=0.40.0",   # correct Bangla letter joining in the Bangla PDF
]

[project.optional-dependencies]
# For running the public API server
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]
# For development and testing
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",       # FastAPI test client
    "build>=1.2.0",        # PyPI build tool
    "twine>=5.0.0",        # PyPI upload tool
]

[project.scripts]
# After `pip install mango-disease-ai[api]`, this command becomes available globally:
#   mango-api          <- starts server on port 8000
#   mango-api --port 8080
#   mango-api --help
mango-api = "mango_disease_ai.server:main"

[project.urls]
"Homepage" = "https://github.com/Arpon-30/UI-Changes-Mango"
"Bug Tracker" = "https://github.com/Arpon-30/UI-Changes-Mango/issues"
"Author" = "https://github.com/Arpon-30"

[tool.setuptools.packages.find]
where = ["."]
include = ["mango_disease_ai*"]

[tool.setuptools.package-data]
# Include model weights AND the docs website HTML bundled inside the package
mango_disease_ai = ["*.pt", "*.pth", "*.py", "*.html", "*.json", "fonts/*.ttf", "fonts/*.txt"]

